<!doctype html>
<html lang="fr" data-theme="commonwealth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100D">
<title>Table de jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Spectral:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="connexion" hidden>
  <div class="boite" id="etape-table" hidden>
    <h2>Table de jeu</h2>
    <div class="doux">Mot de passe de la table</div>
    <input id="mdp" type="password" autocomplete="off" enterkeyhint="go">
    <button class="btn" id="entrer">Entrer</button>
    <div id="err-connexion" class="erreur"></div>
  </div>
  <div class="boite" id="etape-compte" hidden>
    <h2 id="titre-compte">Connexion</h2>
    <div class="doux">Pseudo</div>
    <input id="pseudo" type="text" maxlength="24" autocomplete="username" autocapitalize="off">
    <div class="doux">Code de 8 caractères</div>
    <input id="code" type="password" maxlength="8" autocomplete="current-password" autocapitalize="off" enterkeyhint="go">
    <div id="aide-code" class="doux" hidden>Lettres et chiffres, sans autre règle. Garde-le : en cas d'oubli, l'organisateur peut le réinitialiser.</div>
    <button class="btn" id="valider-compte">Me connecter</button>
    <button class="btn sec" id="bascule-compte" type="button">Créer un compte</button>
    <div id="err-compte" class="erreur"></div>
  </div>
</div>

<div id="app" data-disp="onglets" hidden>
  <div class="barre">
    <h1 id="titre">Table de jeu</h1>
    <button class="btn-barre" id="ouvrir-reglages" type="button">Réglages</button>
  </div>
  <div class="stripe"></div>

  <div id="corps">
    <section class="panneau" id="p-texte" data-p="texte"><div class="contenu">
      <div class="compose">
        <div class="doux" id="qui-joue"></div>
        <div class="ligne"><input id="texte" placeholder="Que fais-tu ? (/dmj pour parler en privé au MJ)" enterkeyhint="send" autocomplete="off"><button class="btn" id="dire" type="button">Dire</button></div>
        <div class="ligne"><button class="btn sec" id="annuler" type="button">Annuler la dernière action</button></div>
        <div id="err" class="erreur"></div>
      </div>
      <div id="zone-jet"></div>
      <div id="attente" class="attente" hidden></div>
      <div id="reprise" hidden>
        <div class="doux">Le MJ n'a pas répondu à ta dernière action.</div>
        <button class="btn" id="reprendre" type="button" style="margin-top:8px">Relancer le MJ</button>
      </div>
      <div id="histoire" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="doux" id="version"></div>
    </div></section>

    <section class="panneau" id="p-carte" data-p="carte"><div class="contenu" id="c-carte"></div></section>
    <section class="panneau" id="p-fiche" data-p="fiche"><div class="contenu" id="c-fiche"></div></section>
    <section class="panneau" id="p-inv" data-p="inv"><div class="contenu" id="c-inv"></div></section>
    <section class="panneau" id="p-quetes" data-p="quetes"><div class="contenu" id="c-quetes"></div></section>
  </div>

  <nav id="onglets" aria-label="Panneaux"></nav>
</div>

<section id="reglages" hidden>
  <div class="barre">
    <h1>Réglages</h1>
    <button class="btn-barre" id="fermer-reglages" type="button">Fermer</button>
  </div>
  <div class="stripe"></div>
  <div class="contenu" id="c-reglages"></div>
</section>

<script src="de.js"></script>
<script src="app.js"></script>
</body>
</html>
